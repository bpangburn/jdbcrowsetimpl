name: Maven Build

on:
  workflow_dispatch:
  push:
    branches: [master, '1.0.*-SNAPSHOT']
  pull_request:
    branches: [master, '1.0.*-SNAPSHOT']

permissions:
  contents: read

concurrency:
  group: maven-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java-version: ['8', '11', '21', '25']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Verify toolchain
        run: mvn --version

      - name: Build and verify Java 8-compatible artifact
        run: mvn -B -ntp clean verify
