version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-maven-plugins:
        applies-to: version-updates
        patterns:
          - "org.apache.maven.plugins:*"
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        applies-to: version-updates
        patterns:
          - "actions/*"
        update-types: [minor, patch]
